<nav class="site-nav">
  <a class="site-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | absolute_url }}">Home</a>

  {% assign pages_list = site.pages | sort:"url" %}
  {% for node in pages_list %}
    {% if node.title != null %}
      {% if node.layout == "page" and node.url != "/tshor/" %}
        <a class="site-nav-item{% if page.url == node.url %} active{% endif %}" href="{{ node.url | absolute_url }}">{{ node.title }}</a>
      {% endif %}
    {% endif %}
  {% endfor %}

  <a class="site-nav-item" href="https://github.com/jaz404" target="_blank" rel="noopener">GitHub</a>
  <a class="site-nav-item" href="mailto:{{ site.author.email }}">Email</a>
</nav>
