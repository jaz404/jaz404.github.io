<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body>

    <div class="wrap">
      <header class="masthead">
        <div class="masthead-inner">
          <h3 class="masthead-title">
            <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
            <small>{{ site.tagline }}</small>
          </h3>
          {% include navbar.html %}
        </div>
      </header>

      <div class="container content">
        {{ content }}
      </div>

      <footer class="site-footer">
        <div class="container">
          <p>&copy; {{ site.time | date: '%Y' }} Jaspreet Singh Chhabra. All rights reserved.</p>
        </div>
      </footer>
    </div>

  </body>
</html>
